[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboharness"
version = "0.1.0"
description = "Gemini 4 native hardware agent harness for the Hiwonder TonyPi humanoid robot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=3.2.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
roboharness = "roboharness.cli:app"

[project.optional-dependencies]
sim = [
    "mujoco>=3.17,<3.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roboharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
